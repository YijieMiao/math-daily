name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Update mathematics papers', 'Check mathematics AI disclosures', 'Restore Math Daily frontend']
    types: [completed]
  workflow_dispatch:
    inputs:
      cancel_deployment_id:
        description: "Cancel a stuck Pages deployment before publishing (optional)"
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.name == 'Update mathematics papers' && github.event.workflow_run.conclusion == 'failure')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          for file in *.js; do node --check "$file"; done
          node tests/test_reader_tools.cjs
          python scripts/validate_math_release.py
      - uses: actions/configure-pages@v5
      - name: Package standalone static site
        run: python scripts/build_site.py
      - name: Check built release
        run: python scripts/validate_math_release.py --root _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Cancel explicitly selected stuck deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.cancel_deployment_id }}
        run: |
          python - <<'PY'
          import os, re, time, urllib.request, json
          deployment_id = os.environ['DEPLOYMENT_ID']
          if not re.fullmatch(r'[a-fA-F0-9]{40}|[0-9]+', deployment_id):
              raise SystemExit('Invalid deployment ID')
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages/deployments/' + deployment_id
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url + '/cancel', headers=headers, method='POST')) as response:
              print('Cancellation requested:', response.status)
          for attempt in range(30):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  status = json.load(response)['status']
              print('Previous deployment status:', status)
              if status in ('cancelled', 'canceled', 'succeed', 'failed', 'deployment_cancelled', 'deployment_failed'):
                  break
              time.sleep(5)
          else:
              raise SystemExit('Previous deployment has not stopped; retry later')
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve successful release revision
        uses: actions/upload-artifact@v4
        with:
          name: math-daily-successful-release
          path: _site/release.txt
          retention-days: 90
      - name: Record successful deployment
        run: echo "Successfully deployed Math Daily revision $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
